<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Lab 14</title>
</head>
<body>


   <script>
       let img = document.createElement('img');
       let bttn = document.createElement('button');
       bttn.type= 'button';
       bttn.textContent = 'Click for new user';
       let form = document.createElement('form');
       form.action = '#';
       form.appendChild(bttn);
       document.body.appendChild(form);
       let fname = document.createElement('p');
       document.body.appendChild(fname);
       let emailaddr = document.createElement('p');
       document.body.appendChild(emailaddr);
       let pnumber = document.createElement('p');
       document.body.appendChild(pnumber);


       const getUser= async()=>{
       let api = await fetch('https://randomuser.me/api/');
       api = await api.json();
       let photo = api.results[0].picture.large;
       img.src = photo;
       img.alt = 'User image';
       let name = api.results[0].name.first;
       fname.textContent = name;
       let email = api.results[0].email;
       emailaddr.textContent = email;
       let number = api.results[0].phone;
       pnumber.textContent = number
       console.log(photo);
       img.style.width = '300px'
       document.body.appendChild(img);

       }
       bttn.addEventListener('click', getUser);
   </script>
</body>
</html>
