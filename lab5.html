<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
   <style>
       #parent{
           background-color: black;
           height: 100px;
           width: 100px;
           box-sizing: border-box;
       }
       #child1{
           background-color: white;
           height: 40px;
           width: 40px;
           margin-left: 30px;
       }
       #child2{
           background-color: white;
           height: 10px;
           width: 40px;
           margin-left: 30px;
           padding-bottom: 20px;
       }
   </style>
</head>
<body>
   <div id="parent">
       <div id="child1"></div>
       <div id="child2"></div>
   </div>
</body>
</html>
